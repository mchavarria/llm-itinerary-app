<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LLM Itinerary App</title>
  <script>
    document.addEventListener("DOMContentLoaded", function() {
      const appContent = `
        <div style='display: flex; flex-direction: column; height: 100vh; justify-content: center; align-items: center; font-family: Arial, sans-serif;'>
          <h1 style='text-align: center; font-size: 1.5em; padding: 10px;'>Welcome to LLM Itinerary App</h1>
          <button id='configureEmail' style='margin: 10px; padding: 15px 25px; font-size: 1em; background: #007bff; color: white; border: none; border-radius: 5px;'>Configure Email</button>
          <button id='inputLLMAPIKey' style='margin: 10px; padding: 15px 25px; font-size: 1em; background: #28a745; color: white; border: none; border-radius: 5px;'>Input LLM API Key</button>
        </div>
      `;
      document.body.innerHTML = appContent;
    });
  </script>
  <style>
    body {
      margin: 0;
      background-color: #f7f7f7;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    button {
      cursor: pointer;
      width: 80%;
    }
  </style>
</head>
<body>
</body>
</html>
